<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/DR7logo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- mobile-web-app-capable e' lo standard W3C; apple-mobile-web-app-capable
         e' mantenuto per retrocompatibilita' con iOS vecchi. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>DR7 - Admin Panel</title>

    <!-- Rete di sicurezza all'avvio (07/09/2026).
         Se il pacchetto principale non si carica, la scheda resta bianca e
         non compare nemmeno la pagina di accesso: da dentro il programma non
         si puo' rimediare, perche' il programma non parte. Questo pezzo sta
         nell'index.html, che non viene mai messo in cache, quindi c'e'
         sempre. Ricarica il file saltando la cache del browser (una volta
         sola per sessione) e poi ricarica la pagina. -->
    <script>
      (function () {
        var CHIAVE = 'dr7_recupero_avvio'
        window.addEventListener('error', function (e) {
          var t = e.target
          if (!t || t.tagName !== 'SCRIPT' || !t.src) return
          try {
            if (sessionStorage.getItem(CHIAVE)) return
            sessionStorage.setItem(CHIAVE, '1')
          } catch (err) { return }
          var riparti = function () { location.reload() }
          try {
            fetch(t.src, { cache: 'reload' }).then(riparti, riparti)
          } catch (err) { riparti() }
        }, true)
      })()
    </script>

    <!-- Open Graph / WhatsApp / social previews -->
    <!-- og-image.png e' 1200x630 con il logo centrato su sfondo nero,
         taglio standard OG (~1.9:1) cosi' WhatsApp non lo croppa male. -->
    <meta property="og:title" content="DR7 A.I. — Admin Panel" />
    <meta property="og:description" content="DR7 — Intelligenza · Controllo · Risultati" />
    <meta property="og:image" content="https://admin.dr7empire.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://admin.dr7empire.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DR7 A.I. — Admin Panel" />
    <meta name="twitter:image" content="https://admin.dr7empire.com/og-image.png" />
  </head>

  </body>
